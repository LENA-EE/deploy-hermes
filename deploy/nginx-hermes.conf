# /etc/nginx/conf.d/hermes.conf  (или server-блок в существующем конфиге админов)
# Логин в браузере → свой порт → свой дашборд. Чужой порт по логину не получить.

map $remote_user $hermes_port {
    include /etc/nginx/hermes-users.map;   # строки вида: ivanov 9121;  — генерирует hermes-user
    default 0;
}

server {
    listen 443 ssl;
    server_name <имя-контейнера>;

    ssl_certificate     /etc/ssl/certs/hermes.crt;
    ssl_certificate_key /etc/ssl/private/hermes.key;

    auth_basic           "Hermes";
    auth_basic_user_file /etc/nginx/hermes.htpasswd;

    location / {
        if ($hermes_port = 0) { return 403; }

        proxy_pass http://127.0.0.1:$hermes_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # websocket, без этого дашборд «мёртвый»
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Authorization "";           # пароль nginx не уходит в Hermes
        proxy_read_timeout 3600s;                    # агент думает долго
        proxy_send_timeout 3600s;
    }
}
