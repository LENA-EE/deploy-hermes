# /etc/hermes/config.template.yaml
# Базовый config.yaml для каждого нового пользователя.
# @MODEL@ @BASE_URL@ @API_KEY@ @WORKDIR@ подставляет hermes-user из /etc/hermes/model.env.
# Проверено на Hermes v0.13.0 (2026-09-16): модель ответила.

model:
  provider: custom            # свой OpenAI-совместимый сервер (LiteLLM). "openai" в v0.13.0 — неизвестный провайдер
  name: @MODEL@
  default: @MODEL@
  base_url: @BASE_URL@
  api_key: @API_KEY@

terminal:
  backend: local              # НЕ docker: нужен docker-сокет, это управление хостом
  cwd: @WORKDIR@

approvals:
  mode: manual                # опасные команды — только после подтверждения человеком
  timeout: 60
  cron_mode: deny             # фоновые задачи опасные команды не выполняют
  # своего списка запрещённых команд в v0.13.0 нет — сеть режут nftables и закрытый egress

security:
  allow_private_urls: false   # веб-инструменты не ходят во внутреннюю сеть
  redact_secrets: true        # маскировать пароли и токены в выводе и логах
  tirith_enabled: true        # сканер команд (если бинарника нет — проверка молча пропускается)
  allow_lazy_installs: false  # агент не доустанавливает пакеты сам

display:
  personality: kawaii
